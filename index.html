<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Friendship Day Wishes ❤️</title>

    <meta name="description" content="Create personalized Friendship Day wishes with interactive animations, music, particles, and downloadable cards!">
    <meta name="theme-color" content="#5B5FFF">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- AOS Animation -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loader -->
    <div id="loader">
        <div class="loader-content">
            <i class="fa-solid fa-heart pulse-icon"></i>
            <h2>Loading Happiness...</h2>
        </div>
    </div>

    <!-- Background Particle Canvas -->
    <div id="particles-js"></div>

    <!-- Dynamic Decoration Overlay Containers -->
    <div id="balloons-container"></div>
    <div id="hearts-container"></div>

    <!-- Audio Player Controls -->
    <audio id="bgMusic" loop>
        <!-- Royalty-free background track -->
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
    </audio>

    <button id="musicBtn" aria-label="Toggle Music">
        <i class="fa-solid fa-play"></i>
        <span>Play Music</span>
    </button>

    <!-- Main App Container -->
    <main class="container">

        <!-- Hero Header -->
        <header class="hero" data-aos="fade-down">
            <div class="badge">Celebration Time 🎉</div>
            <h1>Happy Friendship Day</h1>
            <p>Celebrate Every Unbreakable Bond ❤️</p>
        </header>

        <!-- Interactive Form Section -->
        <section class="nameSection" data-aos="zoom-in">
            <h2>Enter Your Name</h2>
            <div class="input-wrapper">
                <input type="text" id="username" maxlength="25" placeholder="Type your name..." autocomplete="off">
            </div>
            <button id="generateBtn" class="glow-btn">
                <span>Celebrate Friendship</span>
                <i class="fa-solid fa-sparkles"></i>
            </button>
        </section>

        <!-- Interactive Greeting Card Target -->
        <section id="cardSection" data-aos="fade-up" style="display: none;" 
                 data-quotes='[
                     "May your life always be filled with boundless happiness, laughter, success, and unforgettable memories with the ones who matter most.",
                     "Real friendship isn’t about being inseparable, it’s being separated and knowing nothing will change. Wishing you endless joy and laughter!",
                     "To a friend who makes every ordinary day feel like a grand adventure. Thank you for always standing by my side!",
                     "A true friend is the greatest of all blessings. May your life be filled with endless smiles, peace, and love today and forever."
                 ]'>
            <div class="glassCard" id="captureCard">
                <div class="card-badge">Forever Friends</div>
                <h2 class="card-title">Happy Friendship Day!</h2>
                <h1 id="typewriterText"></h1>
                <p class="card-message" id="cardMessage"></p>
                <div class="card-footer-mark">✨ Made with love for you ✨</div>
            </div>
        </section>

        <!-- Dynamic Quotes Widget -->
        <section class="quotes-card" data-aos="fade-up">
            <div class="quote-header">
                <i class="fa-solid fa-quote-left"></i>
                <span>Thought of the Day</span>
            </div>
            <p id="quote">Friends are the family we choose for ourselves.</p>
            <button id="newQuoteBtn" class="secondary-btn">
                <i class="fa-solid fa-arrows-rotate"></i> New Quote
            </button>
        </section>

        <!-- Action Panel -->
        <section class="action-buttons" data-aos="fade-up">
            <button id="downloadBtn" class="action-btn">
                <i class="fa-solid fa-download"></i> Download Card
            </button>
            <button id="shareBtn" class="action-btn">
                <i class="fa-solid fa-share-nodes"></i> Share Wish
            </button>
            <button id="fullscreenBtn" class="action-btn">
                <i class="fa-solid fa-expand"></i> Fullscreen
            </button>
        </section>

        <!-- Social Share Bar -->
        <section class="social" data-aos="fade-up">
            <a href="#" id="waShare" aria-label="Share on WhatsApp"><i class="fab fa-whatsapp"></i></a>
            <a href="#" id="fbShare" aria-label="Share on Facebook"><i class="fab fa-facebook"></i></a>
            <a href="#" id="twShare" aria-label="Share on Twitter"><i class="fab fa-x-twitter"></i></a>
        </section>

        <!-- Footer -->
        <footer>
            Crafted with ❤️ for Friendship Day 2026
        </footer>
    </main>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>

    <!-- App Logic -->
    <script src="script.js"></script>
</body>
</html>
